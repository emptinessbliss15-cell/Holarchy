<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>Camillus Barber List</title><link rel="stylesheet" href="./queue.css"></head><body><main class="queue"><header><p class="eyebrow">CAMILLUS</p><h1 id="title">Barber List</h1><p id="access">Loading…</p></header><section id="join-card" class="card" hidden><h2>Join the list</h2><form id="join-form"><label>Your name<input id="join-name" autocomplete="name" maxlength="80" required placeholder="Name"></label><label class="photo-field">Photo<input id="join-photo" type="file" accept="image/*" capture="user"></label><div id="photo-preview" class="photo-preview" hidden><img id="preview-img" alt="Your photo"><button id="remove-photo" class="secondary" type="button">Remove photo</button></div><button>Join Barber List</button></form><p class="hint">After joining, keep this page to see where you are in line.</p></section><button id="join-another" class="secondary join-another" type="button" hidden>Add another person</button><section class="card"><div class="list-head"><h2>Current list</h2><button id="refresh" class="secondary" type="button">Refresh</button></div><p id="empty">Nobody is waiting yet.</p><div id="groups"></div><small id="updated"></small></section><p id="message" class="message"></p></main><script type="module" src="./queue.js"></script></body></html>
