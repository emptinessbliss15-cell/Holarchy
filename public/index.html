<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111111"><title>Holarchy</title><link rel="stylesheet" href="./style.css"></head><body><main><header><p class="eyebrow">HOLARCHY</p><h1>Local nodes</h1><p>Create here. Keep here. Share when you choose.</p></header><section class="capabilities"><h2>Data</h2><div class="toggle-grid"><label class="toggle"><input type="checkbox" checked disabled><span><strong>Memory</strong><small>live</small></span></label><label class="toggle"><input data-capability="indexedDB" type="checkbox" checked><span><strong>IndexedDB</strong><small>durable local</small></span></label><label class="toggle"><input data-capability="p2p" type="checkbox"><span><strong>P2P</strong><small>WebRTC</small></span></label><label class="toggle"><input data-capability="supabase" type="checkbox"><span><strong>Supabase</strong><small>sync endpoint</small></span></label></div></section><section class="pair"><div class="section-head"><h2>Pair devices</h2><span id="peer-status">not connected</span></div><p class="hint">On the PC, choose Pair phone and scan the QR with the phone. The phone answers automatically; the PC waits for it.</p><button id="pair-easy">Pair phone</button><img id="pair-qr" class="pair-qr" alt="Holarchy pairing QR" hidden><a id="pair-link" class="pair-link" hidden></a><details><summary>Manual WebRTC pairing</summary><textarea id="pair-code" rows="4" placeholder="Pairing code"></textarea><div class="actions"><button id="make-offer">Make offer</button><button id="answer-offer">Answer offer</button><button id="accept-answer">Accept answer</button><button id="copy-code" class="secondary wide">Copy</button></div></details></section><form id="node-form"><label>Node name<input id="node-name" autocomplete="off" required placeholder="What is emerging?"></label><label>Type<select id="node-type"><option>node</option><option>person</option><option>message</option><option>tension</option><option>proposal</option><option>circle</option><option>role</option></select></label><button type="submit">Create node</button></form><section><div class="section-head"><h2>This device</h2><span id="node-count"></span></div><p id="empty-state">No local nodes yet.</p><ul id="node-list"></ul></section></main><script type="module" src="./app.js"></script></body></html>
