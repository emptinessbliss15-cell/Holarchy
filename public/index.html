<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111111"><title>Holarchy</title><link rel="stylesheet" href="./style.css"></head>
<body><main><header><p class="eyebrow">HOLARCHY</p><h1>Local nodes</h1><p>Create here. Keep here. Share later.</p></header>
