<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111111"><title>Holarchy</title><link rel="stylesheet" href="./style.css"></head><body><main>
<header><p class="eyebrow">HOLARCHY</p><h1>Local nodes</h1><p>Create here. Keep here. Share later.</p></header>
<section class="capabilities"><h2>Data</h2><div class="toggle-grid">
<label class="toggle"><input type="checkbox" checked disabled><span><strong>Memory</strong><small>live</small></span></label>
<label class="toggle"><input data-capability="indexedDB" type="checkbox" checked><span><strong>IndexedDB</strong><small>durable local</small></span></label>
<label class="toggle"><input data-capability="p2p" type="checkbox"><span><strong>P2P</strong><small>sync · coming next</small></span></label>
<label class="toggle"><input data-capability="supabase" type="checkbox"><span><strong>Supabase</strong><small>sync · not connected</small></span></label>
</div></section>
<form id="node-form"><label>Node name<input id="node-name" autocomplete="off" required placeholder="What is emerging?"></label><label>Type<select id="node-type"><option>node</option><option>person</option><option>message</option><option>tension</option><option>proposal</option><option>circle</option><option>role</option></select></label><button type="submit">Create node</button></form>
<section><div class="section-head"><h2>This device</h2><span id="node-count"></span></div><p id="empty-state">No local nodes yet.</p><ul id="node-list"></ul></section>
</main><script type="module" src="./app.js"></script></body></html>
